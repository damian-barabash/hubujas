name: Deploy to GitHub Pages

# hubijas.pl — custom domain, so the Vite base stays '/' and public/CNAME ships with the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sanity check (SPA fallback + custom domain + OG image)
        run: |
          test -f dist/index.html   || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/404.html     || { echo "::error::dist/404.html missing (SPA fallback for /admin)"; exit 1; }
          test -f dist/CNAME        || { echo "::error::dist/CNAME missing — custom domain would be reset"; exit 1; }
          grep -q '^hubijas\.pl$' dist/CNAME || { echo "::error::dist/CNAME is not hubijas.pl"; exit 1; }
          test -f dist/assets/og.jpg || { echo "::error::dist/assets/og.jpg missing"; exit 1; }
          echo "dist OK — $(du -sh dist | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
